<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Type Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== Theme tokens ===== */
    :root {
      --bg: #07070d;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.09);
      --text: #e8e8f0;
      --muted: #8b8ca3;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --pink: #f472b6;
      --ok: #34d399;
      --err: #f87171;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /* ===== Base ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
      padding: 0 16px 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Background ===== */
    #particles {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: -2; pointer-events: none;
    }
    .blob {
      position: fixed; width: 42vmax; height: 42vmax; border-radius: 50%;
      filter: blur(90px); opacity: 0.35; z-index: -3; pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob-1 { background: var(--accent); top: -12vmax; left: -10vmax; }
    .blob-2 { background: var(--accent-2); bottom: -14vmax; right: -12vmax; animation-delay: -6s; opacity: 0.22; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(6vmax, 4vmax) scale(1.12); }
    }

    /* ===== Hero ===== */
    .hero { text-align: center; padding: 56px 8px 36px; animation: fadeUp 0.8s ease both; }
    .pill {
      display: inline-block; font-size: 0.78rem; letter-spacing: 0.04em;
      color: #c4b5fd; background: rgba(124, 92, 255, 0.12);
      border: 1px solid rgba(124, 92, 255, 0.3);
      padding: 6px 14px; border-radius: 999px; margin-bottom: 18px;
    }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .grad {
      background: linear-gradient(90deg, var(--accent), var(--pink), var(--accent-2), var(--accent));
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer { to { background-position: 300% 0; } }
    .sub { color: var(--muted); max-width: 560px; margin: 14px auto 0; font-size: 1.02rem; }

    /* ===== Layout ===== */
    .layout {
      max-width: 1080px; margin: 0 auto;
      display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start;
    }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 26px; box-shadow: var(--shadow);
      transition: transform 0.35s ease, border-color 0.3s ease;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.6), transparent 40%, rgba(34, 211, 238, 0.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0.5; pointer-events: none;
    }
    .card:hover { border-color: rgba(255, 255, 255, 0.16); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .card h2 { font-size: 1.15rem; font-weight: 700; }

    .reveal { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d, 0s) forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Form ===== */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { margin-bottom: 14px; }
    .field label { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
    .field input {
      width: 100%; background: rgba(7, 7, 13, 0.6); border: 1px solid var(--border);
      color: var(--text); font: inherit; font-size: 0.95rem; padding: 11px 14px;
      border-radius: 12px; outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .field input::placeholder { color: #55576b; }
    .field input:focus {
      border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.18);
      background: rgba(15, 15, 26, 0.9);
    }
    .field input.invalid {
      border-color: var(--err); box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.15);
      animation: shake 0.4s ease;
    }
    .field input.flash { animation: flash 0.6s ease; }
    @keyframes flash {
      0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.6); }
      100% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* ===== Buttons ===== */
    .btn {
      font: inherit; font-weight: 600; border: none; cursor: pointer; border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.ghost {
      background: var(--surface-strong); color: var(--text);
      border: 1px solid var(--border); padding: 8px 14px; font-size: 0.85rem;
    }
    .btn.ghost:hover { border-color: rgba(124, 92, 255, 0.5); }
    .btn.primary {
      position: relative; width: 100%; margin-top: 22px; padding: 14px 18px;
      font-size: 1rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), #a855f7 55%, var(--pink));
      background-size: 200% 200%;
      box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35); overflow: hidden;
    }
    .btn.primary::after {
      content: ""; position: absolute; top: 0; left: -75%; width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-20deg); transition: left 0.6s ease;
    }
    .btn.primary:hover::after { left: 130%; }
    .btn.primary:hover { box-shadow: 0 14px 40px rgba(124, 92, 255, 0.5); transform: translateY(-1px); }
    .btn.primary:disabled { opacity: 0.7; cursor: wait; transform: none; }
    .spinner {
      display: none; width: 18px; height: 18px; margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn.primary.loading .btn-label { visibility: hidden; }
    .btn.primary.loading .spinner { display: block; position: absolute; inset: 0; margin: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem;
      color: #fecaca; background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35); animation: fadeUp 0.4s ease both;
    }
    .error[hidden] { display: none; }

    /* ===== Result ===== */
    .result-card {
      position: sticky; top: 24px; min-height: 340px;
      display: flex; flex-direction: column; justify-content: center;
    }
    @media (max-width: 880px) { .result-card { position: static; min-height: 0; } }
    .idle { text-align: center; color: var(--muted); }
    .idle p { margin-top: 18px; font-size: 0.95rem; }
    .orb {
      width: 96px; height: 96px; margin: 0 auto; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c4b5fd, var(--accent) 45%, transparent 70%);
      filter: blur(1px);
      animation: float 4s ease-in-out infinite, pulse 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(124, 92, 255, 0.4); }
      50% { box-shadow: 0 0 60px rgba(124, 92, 255, 0.7); }
    }
    #result { animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    #result[hidden] { display: none; }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    .result-label {
      margin: 8px 0 14px; font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: glow 2.5s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 0 rgba(34, 211, 238, 0)); }
      to   { filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.35)); }
    }
    .confidence { display: flex; align-items: baseline; gap: 8px; margin-bottom: 22px; }
    #confidence { font-size: 2.2rem; font-weight: 800; color: var(--ok); font-variant-numeric: tabular-nums; }
    .confidence small { color: var(--muted); }

    /* ===== Probability bars ===== */
    .bars { list-style: none; display: grid; gap: 14px; }
    .bar-head { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
    .bar-head strong { color: var(--text); font-weight: 600; }
    .bar-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
    .bar-fill {
      height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 12px rgba(124, 92, 255, 0.5);
    }
    .bars li.top .bar-fill {
      background: linear-gradient(90deg, var(--accent-2), var(--ok));
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.5);
    }

    footer { text-align: center; color: #4b4d63; font-size: 0.8rem; margin-top: 48px; }

    /* ===== Reduced motion ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <header class="hero">
    <span class="pill">FastAPI · scikit-learn · live inference</span>
    <h1>Room Type <span class="grad">Predictor</span></h1>
    <p class="sub">Describe a listing and the model predicts its room type, with a confidence score for every class.</p>
  </header>

  <main class="layout">
    <section class="card reveal" id="formCard">
      <div class="card-head">
        <h2>Listing details</h2>
        <button type="button" class="btn ghost" id="fillSample">✨ Fill sample</button>
      </div>

      <form id="predictForm" novalidate>
        <div class="field full">
          <label for="apiUrl">API base URL</label>
          <input id="apiUrl" type="text" value="https://nyc-airbnb-room-type-predictor-r0qa.onrender.com" />
        </div>

        <div class="grid">
          <div class="field">
            <label for="neighbourhood_group">Neighbourhood group</label>
            <input id="neighbourhood_group" list="groups" placeholder="e.g. Manhattan" autocomplete="off" />
            <datalist id="groups">
              <option value="Manhattan"></option>
              <option value="Brooklyn"></option>
              <option value="Queens"></option>
              <option value="Bronx"></option>
              <option value="Staten Island"></option>
            </datalist>
          </div>

          <div class="field">
            <label for="neighbourhood">Neighbourhood</label>
            <input id="neighbourhood" placeholder="e.g. Harlem" autocomplete="off" />
          </div>

          <div class="field">
            <label for="latitude">Latitude</label>
            <input id="latitude" type="number" step="any" placeholder="-90 to 90" />
          </div>

          <div class="field">
            <label for="longitude">Longitude</label>
            <input id="longitude" type="number" step="any" placeholder="-180 to 180" />
          </div>

          <div class="field">
            <label for="price">Price per night ($)</label>
            <input id="price" type="number" step="any" min="0" placeholder="e.g. 150" />
          </div>

          <div class="field">
            <label for="minimum_nights">Minimum nights</label>
            <input id="minimum_nights" type="number" step="1" min="1" max="365" placeholder="1 to 365" />
          </div>

          <div class="field">
            <label for="number_of_reviews">Number of reviews</label>
            <input id="number_of_reviews" type="number" step="1" min="0" placeholder="e.g. 45" />
          </div>

          <div class="field">
            <label for="reviews_per_month">Reviews per month</label>
            <input id="reviews_per_month" type="number" step="any" min="0" placeholder="e.g. 1.2" />
          </div>

          <div class="field">
            <label for="calculated_host_listing_count">Host's listing count</label>
            <input id="calculated_host_listing_count" type="number" step="1" min="0" placeholder="e.g. 1" />
          </div>

          <div class="field">
            <label for="availability_365">Availability (days / 365)</label>
            <input id="availability_365" type="number" step="1" min="0" max="365" placeholder="0 to 365" />
          </div>
        </div>

        <button type="submit" class="btn primary" id="submitBtn">
          <span class="btn-label">Predict room type</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="formError" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="card result-card reveal" id="resultCard" style="--d: .15s">
      <div id="idle" class="idle">
        <div class="orb" aria-hidden="true"></div>
        <p>Your prediction will appear here.</p>
      </div>

      <div id="result" hidden>
        <p class="eyebrow">Predicted room type</p>
        <h3 id="resultLabel" class="result-label">—</h3>
        <div class="confidence">
          <span id="confidence">0%</span>
          <small>confidence</small>
        </div>
        <ul id="bars" class="bars"></ul>
      </div>
    </section>
  </main>

  <footer>Built with FastAPI + vanilla HTML, CSS & JS</footer>

  <script>
    /* ===== Config ===== */
    // scikit-learn sorts classes alphabetically, so this order matches model.classes_
    // for the NYC Airbnb room_type target. Edit if your model's classes differ.
    const CLASS_LABELS = ["Entire home/apt", "Private room", "Shared room"];

    // Mirrors the Pydantic Features model so bad input is caught before the request.
    const NUMERIC_RULES = {
      latitude:                      { int: false, min: -90,  max: 90 },
      longitude:                     { int: false, min: -180, max: 180 },
      price:                         { int: false, min: 0 },
      minimum_nights:                { int: true,  min: 1,    max: 365 },
      number_of_reviews:             { int: true,  min: 0 },
      reviews_per_month:             { int: false, min: 0 },
      calculated_host_listing_count: { int: true,  min: 0 },
      availability_365:              { int: true,  min: 0,    max: 365 },
    };

    const TEXT_FIELDS = ["neighbourhood_group", "neighbourhood"];

    const SAMPLE = {
      neighbourhood_group: "Manhattan",
      neighbourhood: "Harlem",
      latitude: 40.8107,
      longitude: -73.9437,
      price: 150,
      minimum_nights: 2,
      number_of_reviews: 45,
      reviews_per_month: 1.2,
      calculated_host_listing_count: 1,
      availability_365: 200,
    };

    const $ = (id) => document.getElementById(id);
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ===== Animated starfield background ===== */
    (function starfield() {
      const canvas = $("particles");
      const ctx = canvas.getContext("2d");
      let dots = [];

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        const count = Math.min(70, Math.floor((innerWidth * innerHeight) / 22000));
        dots = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * (reduceMotion ? 0 : 0.3),
          vy: (Math.random() - 0.5) * (reduceMotion ? 0 : 0.3),
          r: Math.random() * 1.6 + 0.4,
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const d of dots) {
          d.x += d.vx;
          d.y += d.vy;
          if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
          if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(167, 139, 250, 0.5)";
          ctx.fill();
        }
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const a = dots[i], b = dots[j];
            const dist = Math.hypot(a.x - b.x, a.y - b.y);
            if (dist < 120) {
              ctx.strokeStyle = `rgba(124, 92, 255, ${0.15 * (1 - dist / 120)})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(frame);
      }

      addEventListener("resize", resize);
      resize();
      frame();
    })();

    /* ===== 3D tilt on hover (pointer devices only) ===== */
    if (matchMedia("(hover: hover)").matches && !reduceMotion) {
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("mousemove", (e) => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          card.style.transform = `perspective(900px) rotateX(${-y * 3}deg) rotateY(${x * 3}deg)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "";
        });
      });
    }

    /* ===== Helpers ===== */
    function apiBase() {
      return $("apiUrl").value.trim().replace(/\/+$/, "");
    }

    function showError(message) {
      const box = $("formError");
      box.textContent = message;
      box.hidden = false;
    }

    function clearError() {
      $("formError").hidden = true;
    }

    function setLoading(isLoading) {
      const btn = $("submitBtn");
      btn.disabled = isLoading;
      btn.classList.toggle("loading", isLoading);
    }

    function animateNumber(el, to, duration = 1000) {
      if (reduceMotion) {
        el.textContent = `${to.toFixed(1)}%`;
        return;
      }
      const start = performance.now();
      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = `${(to * eased).toFixed(1)}%`;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* ===== Validation ===== */
    function readForm() {
      const errors = [];
      const data = {};

      for (const name of TEXT_FIELDS) {
        const el = $(name);
        el.classList.remove("invalid");
        const value = el.value.trim();
        if (!value) {
          el.classList.add("invalid");
          errors.push(name.replace(/_/g, " "));
        } else {
          data[name] = value;
        }
      }

      for (const [name, rule] of Object.entries(NUMERIC_RULES)) {
        const el = $(name);
        el.classList.remove("invalid");
        const raw = el.value.trim();
        const num = raw === "" ? NaN : Number(raw);

        let ok = Number.isFinite(num);
        if (ok && rule.int) ok = Number.isInteger(num);
        if (ok && rule.min !== undefined) ok = num >= rule.min;
        if (ok && rule.max !== undefined) ok = num <= rule.max;

        if (ok) {
          data[name] = num;
        } else {
          el.classList.add("invalid");
          errors.push(name.replace(/_/g, " "));
        }
      }

      return { data, errors };
    }

    function fillSample() {
      for (const [name, value] of Object.entries(SAMPLE)) {
        const el = $(name);
        el.value = value;
        el.classList.remove("invalid");
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 600);
      }
      clearError();
    }

    /* ===== API ===== */
    function formatApiError(json, status) {
      // FastAPI 422 responses: detail is an array of { loc, msg, ... }
      if (Array.isArray(json.detail)) {
        return json.detail
          .map((d) => `${String(d.loc.slice(-1)[0]).replace(/_/g, " ")}: ${d.msg}`)
          .join(" · ");
      }
      return json.detail || `Request failed with status ${status}.`;
    }

    async function predict(event) {
      event.preventDefault();
      clearError();

      const { data, errors } = readForm();
      if (errors.length) {
        showError(`Please fix: ${errors.join(", ")}`);
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`${apiBase()}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(formatApiError(json, res.status));
        renderResult(json);
      } catch (err) {
        const unreachable = err instanceof TypeError;
        showError(
          unreachable
            ? "Can't reach the API. Check that uvicorn is running and the URL above is correct."
            : err.message
        );
      } finally {
        setLoading(false);
      }
    }

    /* ===== Result rendering ===== */
    function renderResult(json) {
      const probs = json.Probability[0];
      const topIndex = probs.indexOf(Math.max(...probs));
      const topConfidence = probs[topIndex] * 100;

      $("idle").hidden = true;
      $("result").hidden = false;

      // Restart the pop-in animation on repeat predictions
      const result = $("result");
      result.style.animation = "none";
      void result.offsetWidth;
      result.style.animation = "";

      $("resultLabel").textContent = json.Predicted_room_type;
      animateNumber($("confidence"), topConfidence);

      const bars = $("bars");
      bars.innerHTML = "";
      probs.forEach((p, i) => {
        const label = CLASS_LABELS[i] ?? `Class ${i}`;
        const pct = p * 100;

        const li = document.createElement("li");
        if (i === topIndex) li.classList.add("top");
        li.innerHTML = `
          <div class="bar-head"><strong>${label}</strong><span>${pct.toFixed(1)}%</span></div>
          <div class="bar-track"><div class="bar-fill"></div></div>`;
        bars.appendChild(li);

        // Grow bars after the browser paints them at width 0
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            li.querySelector(".bar-fill").style.width = `${pct}%`;
          })
        );
      });
    }

    /* ===== Wire up ===== */
    $("predictForm").addEventListener("submit", predict);
    $("fillSample").addEventListener("click", fillSample);

    // Clear red borders as the user fixes a field
    document.querySelectorAll("#predictForm input").forEach((input) => {
      input.addEventListener("input", () => input.classList.remove("invalid"));
    });
  </script>
</body>
</html>

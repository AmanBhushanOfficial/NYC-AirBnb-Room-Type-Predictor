<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Type Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <header class="hero">
    <span class="pill">FastAPI · scikit-learn · live inference</span>
    <h1>Room Type <span class="grad">Predictor</span></h1>
    <p class="sub">Describe a listing and the model predicts its room type, with a confidence score for every class.</p>
  </header>

  <main class="layout">
    <section class="card reveal" id="formCard">
      <div class="card-head">
        <h2>Listing details</h2>
        <button type="button" class="btn ghost" id="fillSample">✨ Fill sample</button>
      </div>

      <form id="predictForm" novalidate>
        <div class="field full">
          <label for="apiUrl">API base URL</label>
          <input id="apiUrl" type="text" value="http://127.0.0.1:8000" spellcheck="false" autocomplete="off" />
        </div>

        <div class="grid">
          <div class="field">
            <label for="neighbourhood_group">Neighbourhood group</label>
            <input id="neighbourhood_group" list="groups" placeholder="e.g. Manhattan" autocomplete="off" />
            <datalist id="groups">
              <option value="Manhattan"></option>
              <option value="Brooklyn"></option>
              <option value="Queens"></option>
              <option value="Bronx"></option>
              <option value="Staten Island"></option>
            </datalist>
          </div>

          <div class="field">
            <label for="neighbourhood">Neighbourhood</label>
            <input id="neighbourhood" placeholder="e.g. Harlem" autocomplete="off" />
          </div>

          <div class="field">
            <label for="latitude">Latitude</label>
            <input id="latitude" type="number" step="any" placeholder="-90 to 90" />
          </div>

          <div class="field">
            <label for="longitude">Longitude</label>
            <input id="longitude" type="number" step="any" placeholder="-180 to 180" />
          </div>

          <div class="field">
            <label for="price">Price per night ($)</label>
            <input id="price" type="number" step="any" min="0" placeholder="e.g. 150" />
          </div>

          <div class="field">
            <label for="minimum_nights">Minimum nights</label>
            <input id="minimum_nights" type="number" step="1" min="1" max="365" placeholder="1 to 365" />
          </div>

          <div class="field">
            <label for="number_of_reviews">Number of reviews</label>
            <input id="number_of_reviews" type="number" step="1" min="0" placeholder="e.g. 45" />
          </div>

          <div class="field">
            <label for="reviews_per_month">Reviews per month</label>
            <input id="reviews_per_month" type="number" step="any" min="0" placeholder="e.g. 1.2" />
          </div>

          <div class="field">
            <label for="calculated_host_listing_count">Host's listing count</label>
            <input id="calculated_host_listing_count" type="number" step="1" min="0" placeholder="e.g. 1" />
          </div>

          <div class="field">
            <label for="availability_365">Availability (days / 365)</label>
            <input id="availability_365" type="number" step="1" min="0" max="365" placeholder="0 to 365" />
          </div>
        </div>

        <button type="submit" class="btn primary" id="submitBtn">
          <span class="btn-label">Predict room type</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p id="formError" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="card result-card reveal" id="resultCard" style="--d: .15s">
      <div id="idle" class="idle">
        <div class="orb" aria-hidden="true"></div>
        <p>Your prediction will appear here.</p>
      </div>

      <div id="result" hidden>
        <p class="eyebrow">Predicted room type</p>
        <h3 id="resultLabel" class="result-label">—</h3>
        <div class="confidence">
          <span id="confidence">0%</span>
          <small>confidence</small>
        </div>
        <ul id="bars" class="bars"></ul>
      </div>
    </section>
  </main>

  <footer>Built with FastAPI + vanilla HTML, CSS & JS</footer>

  <script src="script.js"></script>
</body>
</html>
